[project]
name = "omni-cloud-backend"
version = "0.1.0"
description = "Huawei Cloud backend for the Rokid Glass3 and Qwen Omni POC"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.30,<1",
    "esdk-obs-python>=3.24,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "PyJWT>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=15,<16",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
